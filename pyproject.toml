[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrkdwnify"
version = "0.2.0"
description = "Convert Markdown to Slack-compatible mrkdwn formatting"
readme = "readme.md"
authors = [
  { name="Maruf Hassan", email="csengineer.maruf@gmail.com" }
]

license = { file="LICENSE" }
requires-python = ">=3.9"
keywords = ["slack", "markdown", "mrkdwn", "converter", "formatting", "text", "block-kit"]

classifiers = [
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Communications :: Chat",
]

dependencies = [
    "markdown-it-py>=3.0.0"
]

[project.urls]
"Homepage" = "https://github.com/zyllus17/mrkdwnify"
"Bug Tracker" = "https://github.com/zyllus17/mrkdwnify/issues"
"Documentation" = "https://github.com/zyllus17/mrkdwnify#readme"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "codecov>=2.1.13",
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
]
